<!-- sldsValidatorIgnore -->
<!--
  Ontario Design System - Currency Input for OmniStudio
  
  Uses TextInput inner component with currency prefix (CAD).
  Follows two-level pattern: Form wrapper + inner UX component.
  
  Compliance:
  - LWR: Compatible (uses Light DOM inner component)
  - LWS: Compatible (no restricted APIs)
  - Ontario DS: Uses TextInput with prefix slot
  - WCAG 2.1 AA: Inherited from TextInput component
-->
<template>
  <c-sf-gps-ds-ca-on-text-input
    type="text"
    inputmode="decimal"
    label={mergedLabel}
    name={_name}
    required={_propSetMap.required}
    optional={_propSetMap.optional}
    disabled={_propSetMap.disabled}
    readonly={_propSetMap.readOnly}
    hint-text={mergedHelpText}
    placeholder={mergedPlaceholder}
    error-message={sfGpsDsErrorMessage}
    value={elementValue}
    has-prefix
    data-omni-input
    onblur={handleBlur}
    onchange={handleChange}
    oninput={handleInput}
  >
    <span slot="prefix">{currencySymbol}</span>
  </c-sf-gps-ds-ca-on-text-input>
</template>
